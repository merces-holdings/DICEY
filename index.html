<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pause</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- GRADIENT BACKGROUND -->
  <div class="bg"></div>

  <!-- GREETING CARD -->
  <div class="card" id="card">
    <h1>Hello.</h1>
    <p class="soft">You don’t need to rush.</p>

    <div class="tap" id="tap">
      Tap slowly
    </div>
  </div>

  <!-- UNLOCK MODAL -->
  <div class="modal hidden" id="modal">
    <div class="modal-box">
      <h2>This moment is yours.</h2>
      <p>Unlock a guided calm experience.</p>

      <button id="unlockBtn">Unlock for ₹29</button>
      <span class="tiny">One time • Instant • Gentle</span>
    </div>
  </div>

  <!-- PAID CONTENT -->
  <div class="card hidden" id="paid">
    <h1>Breathe.</h1>
    <p>In for 4.</p>
    <p>Hold for 4.</p>
    <p>Out for 6.</p>
    <p class="soft">Nothing else matters right now.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
